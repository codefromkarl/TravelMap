name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

env:
  DEPLOY_ARTIFACT_PREFIX: travelmap-pages

jobs:
  production:
    name: Deploy Production
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha != ''
    permissions:
      actions: read
      contents: read
      deployments: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment_url }}
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      # workflow_run is privileged. Checkout only the trusted default-branch
      # revision represented by this workflow run, never the upstream PR SHA.
      - name: Checkout trusted deployment code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate upstream production identity
        env:
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_REF: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          [[ "$UPSTREAM_CONCLUSION" == "success" ]]
          [[ "$UPSTREAM_EVENT" == "push" ]]
          [[ "$UPSTREAM_REF" == "main" ]]
          [[ "$UPSTREAM_REPOSITORY" == "$GITHUB_REPOSITORY" ]]
          [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40,64}$ ]]
          [[ "$UPSTREAM_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$UPSTREAM_RUN_ATTEMPT" =~ ^[0-9]+$ ]]

      - name: Download exact validated artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DEPLOY_ARTIFACT_PREFIX }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/travelmap-pages
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install trusted deployment dependencies
        run: npm ci --ignore-scripts

      - name: Revalidate artifact with trusted policy
        env:
          EXPECTED_SOURCE_WORKFLOW: CI
          EXPECTED_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EXPECTED_SOURCE_EVENT: push
          EXPECTED_SOURCE_REPOSITORY: ${{ github.repository }}
          EXPECTED_SOURCE_REF: main
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_SOURCE_BRANCH: main
          EXPECTED_PR_NUMBER: ""
          EXPECTED_PR_HEAD_SHA: ""
          ARTIFACT_DIR: ${{ runner.temp }}/travelmap-pages
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import path from "node:path";

          const actual = JSON.parse(
            await readFile(path.join(process.env.ARTIFACT_DIR, "source.json"), "utf8"),
          );
          const expected = {
            schema_version: 1,
            workflow: process.env.EXPECTED_SOURCE_WORKFLOW,
            run_id: process.env.EXPECTED_SOURCE_RUN_ID,
            run_attempt: process.env.EXPECTED_SOURCE_RUN_ATTEMPT,
            event: process.env.EXPECTED_SOURCE_EVENT,
            repository: process.env.EXPECTED_SOURCE_REPOSITORY,
            ref: `refs/heads/${process.env.EXPECTED_SOURCE_REF}`,
            sha: process.env.EXPECTED_SOURCE_SHA,
            branch: process.env.EXPECTED_SOURCE_BRANCH,
            pr_number: process.env.EXPECTED_PR_NUMBER,
            pr_head_sha: process.env.EXPECTED_PR_HEAD_SHA,
          };
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error("Artifact source identity does not match workflow_run metadata");
          }
          NODE
          node scripts/validate-deploy-artifact.mjs "$ARTIFACT_DIR"

      # Contract: deploy.sh appends deployment_url=<exact Pages URL> to
      # $GITHUB_OUTPUT. The workflow never reconstructs or guesses this URL.
      - name: Deploy validated production artifact
        id: deploy
        env:
          TRAVEL_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          bash scripts/deploy.sh
          --artifact "${RUNNER_TEMP}/travelmap-pages"
          --branch main

      - name: Validate exact production URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        shell: bash
        run: |
          [[ "$DEPLOYMENT_URL" =~ ^https://[a-zA-Z0-9.-]+\.pages\.dev/?$ ]]

      - name: Smoke exact production deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: bash scripts/health-check.sh "$DEPLOYMENT_URL"

  preview:
    name: Deploy PR Preview
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha != '' &&
      github.event.workflow_run.pull_requests[0].number != null &&
      github.event.workflow_run.pull_requests[0].head.sha != ''
    permissions:
      actions: read
      contents: read
      deployments: write
      issues: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.deployment_url }}
    concurrency:
      group: preview-pr-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    steps:
      - name: Checkout trusted deployment code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate upstream preview identity
        env:
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_REF: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
        shell: bash
        run: |
          [[ "$UPSTREAM_CONCLUSION" == "success" ]]
          [[ "$UPSTREAM_EVENT" == "pull_request" ]]
          [[ -n "$UPSTREAM_REF" ]]
          [[ "$UPSTREAM_REPOSITORY" == "$GITHUB_REPOSITORY" ]]
          [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40,64}$ ]]
          [[ "$UPSTREAM_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$UPSTREAM_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40,64}$ ]]

      - name: Download exact validated artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DEPLOY_ARTIFACT_PREFIX }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/travelmap-pages
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install trusted deployment dependencies
        run: npm ci --ignore-scripts

      - name: Revalidate artifact with trusted policy
        env:
          EXPECTED_SOURCE_WORKFLOW: CI
          EXPECTED_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EXPECTED_SOURCE_EVENT: pull_request
          EXPECTED_SOURCE_REPOSITORY: ${{ github.repository }}
          EXPECTED_SOURCE_REF: refs/pull/${{ github.event.workflow_run.pull_requests[0].number }}/merge
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EXPECTED_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EXPECTED_PR_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/travelmap-pages
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import path from "node:path";

          const actual = JSON.parse(
            await readFile(path.join(process.env.ARTIFACT_DIR, "source.json"), "utf8"),
          );
          const expected = {
            schema_version: 1,
            workflow: process.env.EXPECTED_SOURCE_WORKFLOW,
            run_id: process.env.EXPECTED_SOURCE_RUN_ID,
            run_attempt: process.env.EXPECTED_SOURCE_RUN_ATTEMPT,
            event: process.env.EXPECTED_SOURCE_EVENT,
            repository: process.env.EXPECTED_SOURCE_REPOSITORY,
            ref: process.env.EXPECTED_SOURCE_REF,
            sha: process.env.EXPECTED_SOURCE_SHA,
            branch: process.env.EXPECTED_SOURCE_BRANCH,
            pr_number: process.env.EXPECTED_PR_NUMBER,
            pr_head_sha: process.env.EXPECTED_PR_HEAD_SHA,
          };
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error("Artifact source identity does not match workflow_run metadata");
          }
          NODE
          node scripts/validate-deploy-artifact.mjs "$ARTIFACT_DIR"

      - name: Deploy validated preview artifact
        id: deploy
        env:
          TRAVEL_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: >-
          bash scripts/deploy.sh
          --artifact "${RUNNER_TEMP}/travelmap-pages"
          --branch "pr-${PR_NUMBER}"

      - name: Validate exact preview URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        shell: bash
        run: |
          [[ "$DEPLOYMENT_URL" =~ ^https://[a-zA-Z0-9.-]+\.pages\.dev/?$ ]]

      - name: Smoke exact preview deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: bash scripts/health-check.sh "$DEPLOYMENT_URL"

      - name: Comment with exact preview URL
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: Number(process.env.PR_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Preview deployed and smoke-tested: ${process.env.DEPLOYMENT_URL}`,
            });

  preview-skipped:
    name: Preview Policy Skip
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      (
        github.event.workflow_run.head_repository.full_name != github.repository ||
        github.event.workflow_run.pull_requests[0].number == null ||
        github.event.workflow_run.pull_requests[0].head.sha == ''
      )
    steps:
      - name: Explain preview policy
        run: |
          echo "### Preview deployment skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Privileged previews are limited to same-repository pull requests with trusted event metadata." >> "$GITHUB_STEP_SUMMARY"
