name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=travel-agent --branch=main --commit-dirty=true

      - name: Purge Cloudflare CDN Cache
        continue-on-error: true
        env:
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$ZONE_ID" ]; then
            echo "⚠️ CLOUDFLARE_ZONE_ID not set. Skipping cache purge."
            echo "   To enable auto-purge, add CLOUDFLARE_ZONE_ID to repository secrets."
            exit 0
          fi
          echo "🧹 Purging Cloudflare CDN cache for zone $ZONE_ID ..."
          RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | jq -r '.success // false'
          if [ "$(echo "$RESPONSE" | jq -r '.success // false')" != "true" ]; then
            echo "❌ Purge failed. Errors:"
            echo "$RESPONSE" | jq -r '.errors[]?.message // "Unknown error"'
            echo "💡 Please ensure your API Token has 'Zone:Cache Purge' permission."
          fi
