<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>旅途星辰 — AI 旅行规划</title>
  <script type="importmap">
    {
      "imports": {
        "@earendil-works/pi-agent-core": "https://esm.sh/@earendil-works/pi-agent-core@0.75.1",
        "@earendil-works/pi-ai": "https://esm.sh/@earendil-works/pi-ai@0.75.1",
        "@earendil-works/pi-web-ui": "https://esm.sh/@earendil-works/pi-web-ui@0.75.1",
        "lit": "https://esm.sh/lit@3",
        "typebox": "https://esm.sh/typebox@1.1.24"
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f0f11; color: #e4e4e7; }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid #27272a;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header span { font-size: 13px; color: #71717a; }

    #chat-container {
      flex: 1;
      overflow: hidden;
    }

    chat-panel {
      display: block;
      height: 100%;
    }

    /* pi-web-ui 主题覆盖 */
    chat-panel {
      --bg-primary: #0f0f11;
      --bg-secondary: #18181b;
      --bg-tertiary: #27272a;
      --text-primary: #e4e4e7;
      --text-secondary: #a1a1aa;
      --border-color: #3f3f46;
      --accent-color: #6366f1;
    }

    #export-toolbar {
      display: none;
      margin-left: auto;
      gap: 6px;
      align-items: center;
    }
    #export-toolbar.visible { display: flex; }

    #lang-switcher {
      display: flex;
      gap: 2px;
      margin-left: 8px;
      background: #27272a;
      border-radius: 6px;
      padding: 2px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: #71717a;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }
    .lang-btn:hover { color: #e4e4e7; }
    .lang-btn.active { background: #3f3f46; color: #e4e4e7; }

    .export-btn {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #e4e4e7;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s;
    }
    .export-btn:hover { background: #3f3f46; }
    .export-btn:active { background: #52525b; }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #18181b;
      border: 1px solid #3f3f46;
      color: #e4e4e7;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* PDF 打印样式 */
    @media print {
      body { background: white; color: black; }
      #app { max-width: 100%; margin: 0; }
      header { display: none; }
      #chat-container { overflow: visible; }
      chat-panel { display: none; }
      #export-toolbar { display: none !important; }
      #print-content {
        display: block !important;
        padding: 40px;
        font-size: 12pt;
        line-height: 1.6;
        color: #1a1a1a;
      }
      #print-content h1 { font-size: 22pt; margin-bottom: 8px; }
      #print-content h2 { font-size: 16pt; margin-top: 20px; }
      #print-content h3 { font-size: 13pt; margin-top: 14px; }
      #print-content table { border-collapse: collapse; width: 100%; margin: 10px 0; }
      #print-content th, #print-content td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
      #print-content th { background: #f5f5f5; }
      #print-content hr { border: none; border-top: 1px solid #ddd; margin: 16px 0; }
      @page { margin: 20mm; }
    }
    #print-content { display: none; }

    #history-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 360px;
      height: 100vh;
      background: #18181b;
      border-left: 1px solid #3f3f46;
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 50;
      display: flex;
      flex-direction: column;
    }
    #history-panel.open { transform: translateX(0); }
    #history-panel .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #history-panel .panel-header h2 { font-size: 16px; }
    #history-panel .close-btn {
      background: none; border: none; color: #71717a; font-size: 20px; cursor: pointer;
    }
    #history-panel .close-btn:hover { color: #e4e4e7; }
    #history-list {
      flex: 1; overflow-y: auto; padding: 12px;
    }
    .history-item {
      padding: 12px;
      border: 1px solid #27272a;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .history-item:hover { background: #27272a; }
    .history-item .item-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .history-item .item-date { font-size: 12px; color: #71717a; margin-bottom: 6px; }
    .history-item .item-summary { font-size: 13px; color: #a1a1aa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-item .item-actions { display: flex; gap: 8px; margin-top: 8px; }
    .history-item .item-actions button {
      font-size: 12px; padding: 4px 10px; border-radius: 4px; border: 1px solid #3f3f46; background: #27272a; color: #a1a1aa; cursor: pointer;
    }
    .history-item .item-actions button:hover { color: #e4e4e7; background: #3f3f46; }
    .history-item .item-actions .delete-btn:hover { color: #ef4444; border-color: #ef4444; }
    #history-empty { text-align: center; padding: 40px 20px; color: #71717a; font-size: 14px; }

    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: #71717a;
      font-size: 14px;
    }
  </style>
  <link rel="stylesheet" href="https://esm.sh/@earendil-works/pi-web-ui@0.75.1/app.css" />

<body>
  <div id="app">
    <header>
      <h1>🌍 旅途星辰</h1>
      <span data-i18n="subtitle">AI 旅行规划助手</span>
      <div id="lang-switcher">
        <button class="lang-btn active" data-lang="zh">中文</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ja">日本語</button>
      </div>
      <div id="export-toolbar">
        <button class="export-btn" id="btn-export-md" title="导出为 Markdown 文件" data-i18n-title="exportMd">📄 MD</button>
        <button class="export-btn" id="btn-export-pdf" title="导出为 PDF" data-i18n-title="exportPdf">📕 PDF</button>
        <button class="export-btn" id="btn-share-link" title="复制分享链接" data-i18n-title="share">🔗 <span data-i18n="share">分享</span></button>
      </div>
      <button class="export-btn" id="btn-history" title="历史行程">📋 历史</button>
    </header>
    <div id="print-content"></div>
    <div id="history-panel">
      <div class="panel-header">
        <h2>📋 历史行程</h2>
        <button class="close-btn" id="btn-close-history">✕</button>
      </div>
      <div id="history-list">
        <div id="history-empty">暂无历史行程</div>
      </div>
    </div>
    <div id="toast"></div>
    <div id="chat-container">
      <div id="loading">正在初始化...</div>
      <chat-panel id="chat"></chat-panel>
    </div>
  </div>

  <script type="module">
    import { ChatPanel } from "@earendil-works/pi-web-ui";
    // CSS 已通过 <link> 标签加载，无需 import
    import { Agent } from "@earendil-works/pi-agent-core";
    import { getModel } from "@earendil-works/pi-ai";
    import { Type } from "@earendil-works/pi-ai";

    // ─── System Prompt ────────────────────────────────────
    const SYSTEM_PROMPT = `你是「旅途星辰」，一位专业且贴心的私人旅行管家。

你的职责是根据用户的需求，利用工具搜索景点、天气、酒店信息，
然后统筹规划出一份完整的旅行行程。

## 工作流程

1. **景点搜索** — 使用 search_attractions 工具，根据目的地和偏好搜索景点
2. **天气查询** — 使用 search_weather 工具，获取目标日期的天气预报
3. **酒店推荐** — 使用 search_hotels 工具，根据预算和位置推荐住宿
4. **行程编排** — 综合以上信息，规划每日行程（景点顺序、餐饮、交通）
5. **预算计算** — 使用 calculate_budget 工具，统计所有费用，生成预算明细
6. **行动链接** — 使用 generate_action_links 工具，为需预约景点生成预约链接、酒店比价链接、城际交通搜索链接

## 输出格式

请以结构化格式输出完整的旅行计划，包含：
- 每日行程（景点、餐饮、交通、住宿）
- 天气信息
- 预算明细
- 总体建议

## 局部修改

当用户要求修改某一天的行程时：
1. 理解"只改第X天"的语义
2. 不重新生成完整行程
3. 只重算受影响天数的景点安排
4. 预算自动重算

## 重要规则

- 景点安排要考虑地理位置，避免来回折返
- 每天安排 2-3 个景点，城际移动日可减少为 1-2 个
- 每天必须包含早中晚三餐推荐
- 门票价格、费用必须是纯数字，不带单位
- 如果某个信息无法获取，基于常识给出保守建议，不要说"无法查询"
- 支持多城市行程规划，城际移动日要标注交通建议

{{LANGUAGE_INSTRUCTION}}`;

    // ─── 工具定义 ──────────────────────────────────────────
    // 景点搜索（浏览器端 → 调用后端 API，这里用 mock）
    const searchAttractionsTool = {
      name: "search_attractions",
      label: "景点搜索",
      description: "搜索指定城市的景点信息",
      parameters: Type.Object({
        city: Type.String({ description: "城市名称" }),
        preferences: Type.Optional(Type.Array(Type.String())),
        keywords: Type.Optional(Type.String()),
      }),
      execute: async (_id, params) => {
        const { city } = params;
        // 浏览器端 mock — 后续接入 API
        const mockData = {
          "北京": [
            { name: "故宫博物院", address: "东城区景山前街4号", ticketPrice: 60, visitDuration: 180, description: "明清皇家宫殿" },
            { name: "天坛公园", address: "东城区天坛内东里7号", ticketPrice: 34, visitDuration: 120, description: "明清帝王祭天场所" },
            { name: "颐和园", address: "海淀区新建宫门路19号", ticketPrice: 30, visitDuration: 180, description: "清代皇家园林" },
          ],
          "上海": [
            { name: "外滩", address: "黄浦区中山东一路", ticketPrice: 0, visitDuration: 90, description: "上海地标" },
            { name: "豫园", address: "黄浦区安仁街137号", ticketPrice: 40, visitDuration: 120, description: "明代私家园林" },
            { name: "东方明珠", address: "浦东新区世纪大道1号", ticketPrice: 199, visitDuration: 90, description: "上海标志性建筑" },
          ],
        };
        const attractions = mockData[city] || [
          { name: `${city}中心公园`, address: `${city}市中心`, ticketPrice: 0, visitDuration: 120, description: `${city}主要城市公园` },
        ];
        return {
          content: [{ type: "text", text: `## ${city}景点搜索结果\n\n${attractions.map((a, i) => `${i+1}. **${a.name}** — ¥${a.ticketPrice}\n   ${a.description} | 建议${a.visitDuration}分钟`).join("\n\n")}` }],
          details: { city, attractions },
        };
      },
    };

    const searchWeatherTool = {
      name: "search_weather",
      label: "天气查询",
      description: "查询城市天气预报",
      parameters: Type.Object({
        city: Type.String(),
        days: Type.Optional(Type.Number({ default: 7 })),
      }),
      execute: async (_id, params) => {
        const { city, days = 7 } = params;
        const weathers = ["晴", "多云", "小雨", "阴"];
        const result = Array.from({ length: days }, (_, i) => {
          const d = new Date(); d.setDate(d.getDate() + i);
          return `${d.toISOString().split("T")[0]}: ${weathers[i % weathers.length]} ${18+Math.floor(Math.random()*8)}°C`;
        });
        return {
          content: [{ type: "text", text: `## ${city} ${days}天天气预报\n\n${result.join("\n")}` }],
          details: { city, weather: result },
        };
      },
    };

    const searchHotelsTool = {
      name: "search_hotels",
      label: "酒店搜索",
      description: "搜索城市酒店",
      parameters: Type.Object({
        city: Type.String(),
        budget: Type.Optional(Type.String()),
      }),
      execute: async (_id, params) => {
        const { city } = params;
        return {
          content: [{ type: "text", text: `## ${city}酒店推荐\n\n1. **经济型** ¥200-400/晚\n2. **舒适型** ¥400-800/晚\n3. **高端型** ¥800+/晚` }],
          details: { city },
        };
      },
    };

    const calculateBudgetTool = {
      name: "calculate_budget",
      label: "预算计算",
      description: "自动计算旅行预算明细",
      parameters: Type.Object({
        totalAttractions: Type.Number({ description: "门票总费用" }),
        totalHotels: Type.Number({ description: "住宿总费用" }),
        totalMeals: Type.Number({ description: "餐饮总费用" }),
        totalTransportation: Type.Number({ description: "交通总费用" }),
        budgetLimit: Type.Optional(Type.Number({ description: "预算上限" })),
      }),
      execute: async (_id, params) => {
        const { totalAttractions, totalHotels, totalMeals, totalTransportation, budgetLimit } = params;
        const total = totalAttractions + totalHotels + totalMeals + totalTransportation;
        const lines = [
          "## 💰 预算明细",
          `🎫 门票: ¥${totalAttractions}`,
          `🏨 住宿: ¥${totalHotels}`,
          `🍜 餐饮: ¥${totalMeals}`,
          `🚌 交通: ¥${totalTransportation}`,
          `**总计: ¥${total}**`,
        ];
        if (budgetLimit) {
          lines.push(total > budgetLimit
            ? `\n⚠️ 超出预算上限 ¥${budgetLimit}，超出 ¥${total - budgetLimit}`
            : `\n✅ 在预算 ¥${budgetLimit} 以内，剩余 ¥${budgetLimit - total}`);
        }
        return { content: [{ type: "text", text: lines.join("\n") }], details: { total, budgetLimit } };
      },
    };

    // ─── 行动链接工具 ────────────────────────────────────
    const generateActionLinksTool = {
      name: "generate_action_links",
      label: "行动链接",
      description: "为旅行计划生成实用行动链接：需预约景点的官方预约链接、酒店比价（Booking/飞猪/去哪儿）、城际交通机票火车票搜索链接。",
      parameters: Type.Object({
        tripPlan: Type.Object({
          city: Type.String({ description: "主城市名" }),
          cities: Type.Array(Type.String()),
          startDate: Type.String(),
          endDate: Type.String(),
          days: Type.Array(Type.Object({
            date: Type.String(),
            dayIndex: Type.Number(),
            city: Type.String(),
            isTransferDay: Type.Optional(Type.Boolean()),
            attractions: Type.Array(Type.Object({
              name: Type.String(),
              nameZh: Type.String(),
              reservationRequired: Type.Optional(Type.Boolean()),
            })),
            hotel: Type.Optional(Type.Object({
              name: Type.String(),
            })),
          })),
        }),
      }),
      execute: async (_id, params) => {
        const { tripPlan } = params;
        // 简化版：基于行程内容生成搜索链接
        const lines = ["## 🔗 行动链接"];
        let linkCount = 0;
        for (const day of tripPlan.days) {
          for (const attr of day.attractions || []) {
            if (attr.reservationRequired) {
              lines.push(`- 📍 **${attr.nameZh}** 需预约 → [查询预约方式](https://www.google.com/search?q=${encodeURIComponent(attr.nameZh + ' 预约 门票')})`);
              linkCount++;
            }
            lines.push(`- ℹ️ **${attr.nameZh}** → [查看信息](https://www.google.com/search?q=${encodeURIComponent(attr.nameZh)})`);
            linkCount++;
          }
          if (day.hotel) {
            lines.push(`- 🏨 **${day.hotel.name}** → [Booking.com 比价](https://www.booking.com/searchresults.html?ss=${encodeURIComponent(day.city)})`);
            linkCount++;
          }
        }
        if (tripPlan.cities?.length > 1) {
          for (let i = 0; i < tripPlan.cities.length - 1; i++) {
            const from = tripPlan.cities[i];
            const to = tripPlan.cities[i + 1];
            lines.push(`- 🚄 **${from} → ${to}** → [Skyscanner机票](https://www.skyscanner.net/transport/flights/${encodeURIComponent(from)}/${encodeURIComponent(to)}/) [携程](https://flights.ctrip.com/online/search?departure=${encodeURIComponent(from)}&destination=${encodeURIComponent(to)})`);
            linkCount += 2;
          }
        }
        lines.splice(1, 0, `生成了 **${linkCount}** 个实用链接`);
        return {
          content: [{ type: "text", text: lines.join("\n") }],
          details: { tripPlan, linkCount },
        };
      },
    };

    // ─── 伴游问答工具 ──────────────────────────────────
    const companionQATool = {
      name: "query_trip_data",
      label: "伴游问答",
      description: "查询已生成的行程数据来回答用户追问。支持：门票价格、游览时间、预约信息、是否适合带孩子/老人、酒店价格/评分、预算明细、天气、交通方式等。",
      parameters: Type.Object({
        question: Type.String({ description: "用户的问题" }),
        tripPlan: Type.Object({
          city: Type.String(),
          cities: Type.Array(Type.String()),
          startDate: Type.String(),
          endDate: Type.String(),
          days: Type.Array(Type.Object({
            date: Type.String(),
            dayIndex: Type.Number(),
            city: Type.String(),
            transportation: Type.String(),
            attractions: Type.Array(Type.Object({
              name: Type.String(),
              nameZh: Type.String(),
              nameEn: Type.String(),
              address: Type.String(),
              visitDuration: Type.Number(),
              description: Type.String(),
              category: Type.String(),
              ticketPrice: Type.Number(),
              reservationRequired: Type.Boolean(),
            })),
            hotel: Type.Optional(Type.Object({
              name: Type.String(),
              priceRange: Type.String(),
              rating: Type.Number(),
              estimatedCost: Type.Number(),
            })),
          })),
          weatherInfo: Type.Array(Type.Object({
            date: Type.String(),
            city: Type.String(),
            dayWeather: Type.String(),
            dayTemp: Type.Number(),
            nightTemp: Type.Number(),
          })),
          budget: Type.Optional(Type.Object({
            totalAttractions: Type.Number(),
            totalHotels: Type.Number(),
            totalMeals: Type.Number(),
            totalTransportation: Type.Number(),
            totalInterCityTransport: Type.Number(),
            total: Type.Number(),
          })),
        }),
      }),
      execute: async (_id, params) => {
        const { question, tripPlan } = params;
        // 前端简化版：基于行程数据匹配关键词回答
        const lines = [`**Q**: ${question}`, ""];
        const allAttractions = tripPlan.days?.flatMap(d => d.attractions || []) || [];
        const matched = allAttractions.filter(a =>
          question.includes(a.nameZh) || question.includes(a.nameEn) || question.includes(a.name)
        );
        if (matched.length > 0) {
          for (const a of matched) {
            lines.push(`**${a.nameZh}** (${a.nameEn})`);
            lines.push(`📍 ${a.address} | 🎫 ¥${a.ticketPrice} | ⏱ ${a.visitDuration}分钟`);
            if (a.reservationRequired) lines.push(`⚠️ 需预约`);
            lines.push(`${a.description}`);
          }
        } else if (question.includes("预算") || question.includes("费用")) {
          const b = tripPlan.budget;
          if (b) {
            lines.push(`💰 总预算: ¥${b.total}`);
            lines.push(`🎫 门票 ¥${b.totalAttractions} | 🏨 住宿 ¥${b.totalHotels} | 🍜 餐饮 ¥${b.totalMeals}`);
          }
        } else if (question.includes("天气") || question.includes("温度")) {
          for (const w of tripPlan.weatherInfo || []) {
            lines.push(`${w.date}: ${w.dayWeather} ${w.dayTemp}°C`);
          }
        } else {
          lines.push("请更具体地描述你想了解的行程细节，例如：故宫门票多少钱？");
        }
        return {
          content: [{ type: "text", text: lines.join("\n") }],
          details: { question, matched: matched.length },
        };
      },
    };

    // ─── 初始化 Agent ─────────────────────────────────────
    const provider = localStorage.getItem("travel-agent-provider") || "openai";
    const modelId = localStorage.getItem("travel-agent-model") || "gpt-4o";
    const model = getModel(provider, modelId);

    const agent = new Agent({
      initialState: {
        systemPrompt: SYSTEM_PROMPT,
        model,
        thinkingLevel: "medium",
        tools: [searchAttractionsTool, searchWeatherTool, searchHotelsTool, calculateBudgetTool, generateActionLinksTool, companionQATool],
        messages: [],
      },
    });

    // ─── 导出服务 ─────────────────────────────────────────
    const EXPORT_STORAGE_KEY = "travel-agent-exported-trips";

    function getLastAssistantContent() {
      const msgs = agent.state.messages;
      for (let i = msgs.length - 1; i >= 0; i--) {
        if (msgs[i].role === "assistant" && typeof msgs[i].content === "string" && msgs[i].content.length > 100) {
          return msgs[i].content;
        }
      }
      return null;
    }

    function showToast(msg, duration = 2500) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(el._hide);
      el._hide = setTimeout(() => el.classList.remove("show"), duration);
    }

    function generateMarkdown(content) {
      // 如果没有 Markdown 标题，添加文档头
      if (!content.trim().startsWith("#")) {
        const date = new Date().toLocaleDateString("zh-CN");
        return `# 🗺️ 旅行计划
> 由「旅途星辰」AI 旅行规划助手生成 · ${date}

---

${content}

---
*本计划由 AI 自动生成，仅供参考。*`;
      }
      return content;
    }

    function downloadMarkdown(content) {
      const md = generateMarkdown(content);
      const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const dateStr = new Date().toISOString().split("T")[0];
      a.href = url;
      a.download = `旅行计划-${dateStr}.md`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("✅ Markdown 已下载");
    }

    function exportPDF(content) {
      const md = generateMarkdown(content);
      const printEl = document.getElementById("print-content");
      // 将 Markdown 转为简单 HTML
      const html = md
        .replace(/^### (.+)$/gm, "<h3>$1</h3>")
        .replace(/^## (.+)$/gm, "<h2>$1</h2>")
        .replace(/^# (.+)$/gm, "<h1>$1</h1>")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/^\d+\.\s+(.+)$/gm, (m, p1) => `<li>${p1}</li>`)
        .replace(/^-\s+(.+)$/gm, "<li>$1</li>")
        .replace(/^---$/gm, "<hr>")
        .replace(/\n\n/g, "</p><p>")
        .split("\n").map(line => line.startsWith("<") ? line : (line.trim() ? `<p>${line}</p>` : "")).join("\n");
      printEl.innerHTML = `<h1 style="text-align:center;margin-bottom:4px;">🗺️ 旅行计划</h1>
<p style="text-align:center;color:#666;font-size:11pt;margin-bottom:20px;">由「旅途星辰」AI 生成 · ${new Date().toLocaleDateString("zh-CN")}</p>
${html}`;
      window.print();
      showToast("🖨️ 请在打印对话框中选择「另存为 PDF」");
    }

    function createShareLink(content) {
      const tripId = crypto.randomUUID();
      const stored = JSON.parse(localStorage.getItem(EXPORT_STORAGE_KEY) || "{}");
      stored[tripId] = {
        content,
        title: `旅行计划`,
        createdAt: new Date().toISOString(),
      };
      localStorage.setItem(EXPORT_STORAGE_KEY, JSON.stringify(stored));

      const url = new URL(window.location.href);
      url.searchParams.set("trip", tripId);

      navigator.clipboard.writeText(url.toString()).then(() => {
        showToast("🔗 分享链接已复制到剪贴板");
      }).catch(() => {
        // fallback: 选择文本
        const ta = document.createElement("textarea");
        ta.value = url.toString();
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("🔗 分享链接已复制到剪贴板");
      });

      // 更新历史列表
      renderSharedTrips();
    }

    // ─── 分享链接加载 ─────────────────────────────────────
    function loadSharedTrip() {
      const params = new URLSearchParams(window.location.search);
      const tripId = params.get("trip");
      if (!tripId) return;

      const stored = JSON.parse(localStorage.getItem(EXPORT_STORAGE_KEY) || "{}");
      const trip = stored[tripId];
      if (!trip) {
        showToast("⚠️ 未找到该分享的行程", 4000);
        return;
      }

      // 在聊天中注入分享的行程
      const msg = {
        role: "assistant",
        content: `# 📋 分享的旅行计划

${trip.content}`,
        timestamp: Date.now(),
      };
      // 追加消息并触发重渲染
      agent.state.messages = [...agent.state.messages, msg];
      showToast("📋 已加载分享的行程", 3000);
    }

    function renderSharedTrips() {
      const stored = JSON.parse(localStorage.getItem(EXPORT_STORAGE_KEY) || "{}");
      // 清理过期（>7天）记录
      const now = Date.now();
      const maxAge = 7 * 24 * 60 * 60 * 1000;
      let changed = false;
      for (const [id, trip] of Object.entries(stored)) {
        if (now - new Date(trip.createdAt).getTime() > maxAge) {
          delete stored[id];
          changed = true;
        }
      }
      if (changed) {
        localStorage.setItem(EXPORT_STORAGE_KEY, JSON.stringify(stored));
      }
    }

    // ─── 监听 Agent 事件 ──────────────────────────────────
    let lastTripContent = "";
    agent.subscribe((event) => {
      if (event.type === "agent_end") {
        const content = getLastAssistantContent();
        if (content && content !== lastTripContent && content.length > 200) {
          lastTripContent = content;
          document.getElementById("export-toolbar")?.classList.add("visible");
        }
      }
      if (event.type === "turn_start") {
        // 新一轮对话开始，隐藏导出按钮
        document.getElementById("export-toolbar")?.classList.remove("visible");
      }
    });

    // ─── 绑定导出按钮 ─────────────────────────────────────
    document.getElementById("btn-export-md")?.addEventListener("click", () => {
      const content = getLastAssistantContent();
      if (!content) { showToast("⚠️ 没有可导出的行程内容"); return; }
      downloadMarkdown(content);
    });

    document.getElementById("btn-export-pdf")?.addEventListener("click", () => {
      const content = getLastAssistantContent();
      if (!content) { showToast("⚠️ 没有可导出的行程内容"); return; }
      exportPDF(content);
    });

    document.getElementById("btn-share-link")?.addEventListener("click", () => {
      const content = getLastAssistantContent();
      if (!content) { showToast("⚠️ 没有可导出的行程内容"); return; }
      createShareLink(content);
    });

    // ─── 初始化 ChatPanel ─────────────────────────────────
    document.getElementById("loading")?.remove();
    const chatPanel = document.getElementById("chat");
    await chatPanel.setAgent(agent, {
      onApiKeyRequired: async (prov) => {
        const key = prompt(`请输入 ${prov} API Key:`);
        if (key) {
          localStorage.setItem(`api-key-${prov}`, key);
          return true;
        }
        return false;
      },
    });

    // 加载分享的行程
    loadSharedTrip();
    // 清理过期分享
    renderSharedTrips();

    // ─── i18n 多语言 ────────────────────────────────────
    const I18N = {
      zh: {
        subtitle: "AI 旅行规划助手",
        share: "分享",
        loading: "正在初始化...",
        exportMd: "导出为 Markdown 文件",
        exportPdf: "导出为 PDF",
        shareTitle: "复制分享链接",
        noContent: "⚠️ 没有可导出的行程内容",
        mdDownloaded: "✅ Markdown 已下载",
        pdfHint: "🖨️ 请在打印对话框中选择「另存为 PDF」",
        linkCopied: "🔗 分享链接已复制到剪贴板",
        tripNotFound: "⚠️ 未找到该分享的行程",
        tripLoaded: "📋 已加载分享的行程",
        langSet: "语言已切换为中文",
      },
      en: {
        subtitle: "AI Travel Planner",
        share: "Share",
        loading: "Initializing...",
        exportMd: "Export as Markdown",
        exportPdf: "Export as PDF",
        shareTitle: "Copy share link",
        noContent: "⚠️ No itinerary to export",
        mdDownloaded: "✅ Markdown downloaded",
        pdfHint: "🖨️ Select 'Save as PDF' in print dialog",
        linkCopied: "🔗 Share link copied to clipboard",
        tripNotFound: "⚠️ Shared trip not found",
        tripLoaded: "📋 Shared trip loaded",
        langSet: "Language switched to English",
      },
      ja: {
        subtitle: "AI旅行プランナー",
        share: "共有",
        loading: "初期化中...",
        exportMd: "Markdownでエクスポート",
        exportPdf: "PDFでエクスポート",
        shareTitle: "共有リンクをコピー",
        noContent: "⚠️ エクスポートする旅程がありません",
        mdDownloaded: "✅ Markdownダウンロード完了",
        pdfHint: "🖨️ 印刷ダイアログで「PDFとして保存」を選択",
        linkCopied: "🔗 共有リンクをクリップボードにコピーしました",
        tripNotFound: "⚠️ 共有された旅程が見つかりません",
        tripLoaded: "📋 共有された旅程を読み込みました",
        langSet: "言語を日本語に切り替えました",
      },
    };

    const LANG_PROMPTS = {
      zh: "",
      en: "Please output all travel plan content in English. Keep attraction names in their original Chinese language.",
      ja: "すべての旅行プラン内容を日本語で出力してください。観光スポット名は元の中国語のままにしてください。",
    };

    let currentLang = localStorage.getItem("travel-agent-lang") || "zh";

    function applyI18n(lang) {
      const dict = I18N[lang] || I18N.zh;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (dict[key]) el.textContent = dict[key];
      });
      document.querySelectorAll("[data-i18n-title]").forEach(el => {
        const key = el.getAttribute("data-i18n-title");
        if (dict[key]) el.title = dict[key];
      });
      // 更新语言按钮状态
      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
      // 更新 html lang 属性
      const langMap = { zh: "zh-CN", en: "en", ja: "ja" };
      document.documentElement.lang = langMap[lang] || "zh-CN";
    }

    function updateAgentLanguage(lang) {
      const instruction = LANG_PROMPTS[lang] || "";
      // 替换 system prompt 中的语言占位符
      const basePrompt = SYSTEM_PROMPT.replace("{{LANGUAGE_INSTRUCTION}}", instruction);
      agent.state.systemPrompt = basePrompt;
    }

    // 语言切换按钮
    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const lang = btn.dataset.lang;
        currentLang = lang;
        localStorage.setItem("travel-agent-lang", lang);
        applyI18n(lang);
        updateAgentLanguage(lang);
        showToast(I18N[lang]?.langSet || "语言已切换");
      });
    });

    // 初始化时应用保存的语言
    if (currentLang !== "zh") {
      applyI18n(currentLang);
      updateAgentLanguage(currentLang);
    }

    // ─── IndexedDB 会话持久化 ──────────────────────────────
    const DB_NAME = "TravelAgentDB";
    const DB_VERSION = 1;
    const STORE_NAME = "trips";

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            const store = db.createObjectStore(STORE_NAME, { keyPath: "id" });
            store.createIndex("updatedAt", "updatedAt");
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveTrip(id, title, summary, content, messages) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        const now = new Date().toISOString();
        // 先查是否已存在
        const getReq = store.get(id);
        getReq.onsuccess = () => {
          const existing = getReq.result;
          const record = {
            id,
            title,
            summary,
            content,
            messages,
            createdAt: existing?.createdAt || now,
            updatedAt: now,
          };
          const putReq = store.put(record);
          putReq.onsuccess = () => resolve(record);
          putReq.onerror = () => reject(putReq.error);
        };
        getReq.onerror = () => reject(getReq.error);
      });
    }

    async function listTrips() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const index = store.index("updatedAt");
        const req = index.openCursor(null, "prev");
        const results = [];
        req.onsuccess = (e) => {
          const cursor = e.target.result;
          if (cursor) {
            results.push(cursor.value);
            cursor.continue();
          } else {
            resolve(results);
          }
        };
        req.onerror = () => reject(req.error);
      });
    }

    async function loadTripById(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const req = store.get(id);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function deleteTripById(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const req = tx.objectStore(STORE_NAME).delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    // ─── 自动保存 ──────────────────────────────────────────
    let currentTripId = null;
    let saveTimeout = null;

    function autoSaveTrip() {
      const content = getLastAssistantContent();
      if (!content || content.length < 200) return;
      if (!currentTripId) currentTripId = crypto.randomUUID();

      // 提取标题和摘要
      let title = "未命名行程";
      const cityMatch = content.match(/(?:目的地|城市)[：:]\s*\*{0,2}([^*\n,，]+)/);
      if (cityMatch) title = cityMatch[1].trim();
      else {
        const hMatch = content.match(/^#+\s*(.+?)(行程|旅行|计划)/m);
        if (hMatch) title = hMatch[1].trim() + hMatch[2];
      }
      const summary = content.replace(/[#*\n]/g, " ").substring(0, 100).trim();

      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        saveTrip(currentTripId, title, summary, content, agent.state.messages)
          .catch(err => console.error("Auto-save failed:", err));
      }, 1000);
    }

    // ─── 历史面板 ──────────────────────────────────────────
    const historyPanel = document.getElementById("history-panel");
    const historyList = document.getElementById("history-list");
    const historyEmpty = document.getElementById("history-empty");

    async function renderHistory() {
      try {
        const trips = await listTrips();
        if (trips.length === 0) {
          historyList.innerHTML = '<div id="history-empty">暂无历史行程</div>';
          return;
        }
        historyList.innerHTML = trips.map(trip => {
          const date = new Date(trip.updatedAt).toLocaleDateString("zh-CN");
          return `<div class="history-item" data-id="${trip.id}">
            <div class="item-title">${trip.title}</div>
            <div class="item-date">${date}</div>
            <div class="item-summary">${trip.summary}</div>
            <div class="item-actions">
              <button class="restore-btn" data-id="${trip.id}">恢复</button>
              <button class="delete-btn" data-id="${trip.id}">删除</button>
            </div>
          </div>`;
        }).join("");

        // 绑定恢复和删除
        historyList.querySelectorAll(".restore-btn").forEach(btn => {
          btn.addEventListener("click", async (e) => {
            e.stopPropagation();
            const id = btn.dataset.id;
            const trip = await loadTripById(id);
            if (trip?.messages && Array.isArray(trip.messages)) {
              agent.state.messages = [...trip.messages];
              currentTripId = id;
              showToast("📋 已恢复行程");
              historyPanel.classList.remove("open");
            } else {
              showToast("⚠️ 无法恢复");
            }
          });
        });

        historyList.querySelectorAll(".delete-btn").forEach(btn => {
          btn.addEventListener("click", async (e) => {
            e.stopPropagation();
            await deleteTripById(btn.dataset.id);
            showToast("🗑️ 已删除");
            renderHistory();
          });
        });
      } catch (err) {
        console.error("Render history failed:", err);
      }
    }

    document.getElementById("btn-history")?.addEventListener("click", () => {
      historyPanel.classList.toggle("open");
      renderHistory();
    });
    document.getElementById("btn-close-history")?.addEventListener("click", () => {
      historyPanel.classList.remove("open");
    });

    // ─── Agent 事件监听 + 自动保存 ──────────────────────────
    const origSubscribe = agent.subscribe.bind(agent);
    // 追加 auto-save 到已有的事件监听
    agent.subscribe((event) => {
      if (event.type === "agent_end") {
        autoSaveTrip();
      }
      if (event.type === "turn_start") {
        // 新对话可能产生新行程
        currentTripId = null;
      }
    });

    // ─── 页面加载时恢复会话 ──────────────────────────────────
    async function tryRestoreSession() {
      try {
        const trips = await listTrips();
        if (trips.length > 0 && !new URLSearchParams(window.location.search).get("trip")) {
          const latest = trips[0]; // listTrips 已按 updatedAt desc 排序
          if (latest.messages && Array.isArray(latest.messages) && latest.messages.length > 0) {
            const timeDiff = Date.now() - new Date(latest.updatedAt).getTime();
            // 只在 24 小时内自动恢复
            if (timeDiff < 24 * 60 * 60 * 1000) {
              agent.state.messages = [...latest.messages];
              currentTripId = latest.id;
              showToast("📋 已恢复上次的会话");
            }
          }
        }
      } catch (err) {
        console.error("Session restore failed:", err);
      }
    }
    tryRestoreSession();
  </script>
</body>
