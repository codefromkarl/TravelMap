<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8ef7"/>
      <stop offset="100%" style="stop-color:#6fa3ff"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- 装饰圆 -->
  <circle cx="900" cy="200" r="300" fill="rgba(255,255,255,0.1)"/>
  <circle cx="200" cy="500" r="200" fill="rgba(255,255,255,0.1)"/>
  
  <!-- 标题 -->
  <text x="600" y="220" text-anchor="middle" font-family="sans-serif" font-size="72" font-weight="bold" fill="white">🗺️ 旅图 TravelMap</text>
  
  <!-- 副标题 -->
  <text x="600" y="300" text-anchor="middle" font-family="sans-serif" font-size="36" fill="white">AI 驱动的智能旅行规划助手</text>
  
  <!-- 特性标签 -->
  <rect x="120" y="380" width="160" height="50" rx="25" fill="rgba(255,255,255,0.2)"/>
  <text x="200" y="412" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">智能行程</text>
  
  <rect x="370" y="380" width="160" height="50" rx="25" fill="rgba(255,255,255,0.2)"/>
  <text x="450" y="412" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">交互地图</text>
  
  <rect x="620" y="380" width="160" height="50" rx="25" fill="rgba(255,255,255,0.2)"/>
  <text x="700" y="412" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">语音播报</text>
  
  <rect x="870" y="380" width="160" height="50" rx="25" fill="rgba(255,255,255,0.2)"/>
  <text x="950" y="412" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">多模型AI</text>
  
  <!-- 底部 -->
  <text x="600" y="550" text-anchor="middle" font-family="sans-serif" font-size="20" fill="rgba(255,255,255,0.8)">travel.codefromkarl.xyz</text>
